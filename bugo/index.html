<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>故 이종두 님 부고</title>
<meta property="og:title" content="[부고] 故 이종두 님">
<meta property="og:description" content="발인 11월 16일(월) 오전 6시 · 칠곡경북대학교병원 장례식장">
<meta property="og:type" content="website">
<style>:root{color-scheme:light}body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 한 장짜리 부고 카드. 위에서 아래로 근조 표시 → 고인 → 알림 글 → 일정 → 빈소 · 길찾기 → 맺음말 */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#1B1C1E; --muted:#5E6166; --line:#D9DADB; --soft:#F5F5F4; --mark:#2B2D31;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
/* 사용자 요청: 어두운 모드에서도 늘 흰색 */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--sans)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.head{display:grid;justify-items:center;gap:14px;padding:40px 24px 30px;text-align:center;border-bottom:1px solid var(--line)}
.ribbon{width:46px;height:46px;position:relative}
.ribbon::before,.ribbon::after{content:"";position:absolute;left:50%;top:4px;width:12px;height:40px;background:var(--mark);border-radius:2px}
.ribbon::before{transform:translateX(-90%) rotate(18deg);transform-origin:top center}
.ribbon::after{transform:translateX(-10%) rotate(-18deg);transform-origin:top center}
.kicker{font:600 15px/1 var(--serif);letter-spacing:.6em;padding-left:.6em;color:var(--muted)}
.name{font:700 clamp(30px,8vw,38px)/1.25 var(--serif);margin:0;letter-spacing:.04em}
.name small{display:block;font:400 15px/1.6 var(--sans);letter-spacing:0;color:var(--muted);margin-top:4px}
.condol{margin:0;font:400 15px/1.6 var(--serif);color:var(--muted)}
.body{display:grid;gap:26px;padding:28px 24px 32px}
.notice{margin:0;font:400 17px/1.9 var(--serif);text-align:center;text-wrap:balance}
.sec{display:grid;gap:10px}
.sec h2{margin:0;font:600 13px/1 var(--sans);letter-spacing:.18em;color:var(--muted)}
dl{margin:0;display:grid;border-top:1px solid var(--line)}
dl div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
dt{color:var(--muted);font-size:15px}
dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.place{background:var(--soft);border-radius:6px;padding:16px;display:grid;gap:4px}
.place b{font-size:17px}
.place span{color:var(--muted);font-size:15px}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:500 14.5px/1.2 var(--sans);text-decoration:none;cursor:pointer;text-align:center}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.toast{min-height:1.4em;margin:0;font-size:13.5px;color:var(--muted);text-align:center}
.close{margin:0;padding-top:22px;border-top:1px solid var(--line);font:400 15.5px/1.9 var(--serif);text-align:center;color:var(--muted)}
.close b{display:block;color:var(--ink);font-weight:600;margin-top:10px}
</style>

<div class="wrap">
  <article class="card">
    <header class="head">
      <div class="ribbon" aria-hidden="true"></div>
      <div class="kicker">訃 告</div>
      <h1 class="name">故 이종두 님<small>상주 이두석의 부친</small></h1>
      <p class="condol">삼가 고인의 명복을 빕니다</p>
    </header>

    <div class="body">
      <p class="notice">이두석의 부친 이종두 님께서<br>2026년 11월 14일(토) 별세하셨기에<br>삼가 알려드립니다.</p>

      <section class="sec">
        <h2>장례 일정</h2>
        <dl>
          <div><dt>별세</dt><dd>2026년 11월 14일 (토)</dd></div>
          <div><dt>발인</dt><dd>2026년 11월 16일 (월) 오전 6시</dd></div>
          <div><dt>장지</dt><dd>전라남도 화순</dd></div>
          <div><dt>상주</dt><dd>이두석</dd></div>
        </dl>
      </section>

      <section class="sec">
        <h2>빈소</h2>
        <div class="place">
          <b>칠곡경북대학교병원 장례식장</b>
          <span id="addr">대구광역시 북구 호국로 807</span>
        </div>
        <div class="btns">
          <a class="btn" href="https://map.naver.com/p/search/%EC%B9%A0%EA%B3%A1%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90%EB%B3%91%EC%9B%90%20%EC%9E%A5%EB%A1%80%EC%8B%9D%EC%9E%A5" target="_blank" rel="noopener">네이버 지도</a>
          <a class="btn" href="https://map.kakao.com/?q=%EC%B9%A0%EA%B3%A1%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90%EB%B3%91%EC%9B%90%20%EC%9E%A5%EB%A1%80%EC%8B%9D%EC%9E%A5" target="_blank" rel="noopener">카카오맵</a>
          <button class="btn" type="button" id="copy">주소 복사</button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
      </section>

      <p class="close">마음으로 함께해 주시면 고맙겠습니다.<br>직접 연락드리지 못하고 글로 알려드리는 점<br>너그러이 양해 부탁드립니다.<b>상주 이두석 올림</b></p>
    </div>
  </article>
</div>

<script>
document.getElementById('copy').addEventListener('click', () => {
  const text = '칠곡경북대학교병원 장례식장, ' + document.getElementById('addr').textContent;
  const t = document.getElementById('toast');
  const done = () => { t.textContent = '주소를 복사했습니다.'; };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('addr'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    t.textContent = '주소를 선택했습니다. 길게 눌러 복사하세요.';
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
});
</script>

<script>
// 2026-11-15 13:00(한국 시간)이 지나면 내용을 가린다 (파일 삭제 전 대비)
if (Date.now() >= Date.parse('2026-11-15T13:00:00+09:00')) {
  document.querySelector('.wrap').innerHTML = '<p style="text-align:center;padding:80px 0;color:#5E6166">장례가 끝나 안내를 내렸습니다.<br>조문해 주신 모든 분께 감사드립니다.</p>';
}
</script>
</body>
</html>
