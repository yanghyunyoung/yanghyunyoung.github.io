<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1b1d22; --sub: #5d6470;
    --line: #cfe0f6; --accent: #6aa6ec; --shadow: 0 3px 10px rgba(80,120,180,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Noto Sans KR", -apple-system, sans-serif; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--card);
          padding: 0 16px 96px; position: relative; }
  .marquee { overflow: hidden; white-space: nowrap; color: var(--accent); font-weight: 600;
             font-size: 13px; padding: 10px 0; }
  .marquee span { display: inline-block; animation: run 30s linear infinite; }
  @keyframes run { to { transform: translateX(-50%); } }
  .top { display: flex; justify-content: space-between; margin-top: 8px; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #eceef2;
           display: grid; place-items: center; cursor: pointer; color: #666; }
  .round svg { width: 20px; height: 20px; }
  .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; display: block; padding: 10px; border: 1.5px solid var(--line); background-color: #fff;
            margin: 4px auto 0; }
  h1 { text-align: center; font-size: 26px; font-weight: 800; margin: 18px 0 6px; }
  .bio { text-align: center; color: var(--sub); font-size: 14px; font-weight: 600; margin: 0 auto; max-width: 340px; line-height: 1.6; word-break: keep-all; }
  .handle { text-align: center; color: var(--sub); font-size: 14px; font-weight: 600; margin: 6px 0 14px; }
  .ig { display: block; width: 28px; margin: 0 auto 24px; color: #c13584; }
  .search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line);
            border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .search input { border: 0; outline: 0; font: inherit; font-size: 16px; flex: 1; min-width: 0; }
  .btn { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink);
         border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
         padding: 18px 14px; margin-bottom: 12px; font-weight: 600; font-size: 16px; }
  .btn .t { flex: 1; text-align: center; }
  .btn .arr { color: #999; }
  .item { padding: 10px 14px 10px 10px; }
  .thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex: none;
           background: linear-gradient(135deg,#9ec5f0,#d7e7fa); display: grid; place-items: center;
           color: #fff; font-weight: 800; }
  hr { border: 0; border-top: 1.5px dashed var(--line); margin: 20px 0; }
  .notice { text-align: center; font-size: 14px; color: var(--sub); margin: 0 0 16px; }
  .empty { text-align: center; color: var(--sub); padding: 24px 0; display: none; }
  .chat { position: fixed; right: max(16px, calc(50% - 224px)); bottom: 20px; width: 56px; height: 56px;
          border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
          box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222;
           color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px; opacity: 0;
           transition: opacity .2s; pointer-events: none; }
</style>
</head>
<body>
<div class="page">
  <div class="marquee"><span id="disc"></span></div>
  <div class="top">
    <button class="round" id="copy" aria-label="링크 복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <button class="round" id="share" aria-label="공유"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
  <img class="avatar" id="avatar" alt="">
  <h1 id="name"></h1>
  <p class="bio" id="bio"></p>
  <p class="handle" id="handle"></p>
  <a class="ig" id="ig" aria-label="인스타그램"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="번호나 검색어를 입력하세요"></label>
  <div id="featured"></div>
  <hr>
  <p class="notice" id="notice"></p>
  <div id="list"></div>
  <p class="empty" id="empty">찾는 숙소가 없어요</p>
  <a class="chat" id="chat" aria-label="DM 보내기"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><circle cx="8.5" cy="12" r=".8" fill="currentColor"/><circle cx="12" cy="12" r=".8" fill="currentColor"/><circle cx="15.5" cy="12" r=".8" fill="currentColor"/></svg></a>
</div>
<div class="toast" id="toast"></div>
<script type="application/json" id="data">{"profile": {"name": "트립도슨트", "bio": "전시 가이드처럼 숙소의 숨겨진 매력, 인테리어 포인트, 주변 즐길 거리를 깊이 있게 해설해 드립니다.", "handle": "tripdocent", "avatar": "thumbs/avatar.jpg"}, "disclosure": "📢 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.", "notice": "📌 상품번호는 게시물 아래 '댓글'에 있어요 💙", "featured": [], "items": [{"no": 1, "title": "송정 바다 앞 료칸 숙소", "platform": "쿠팡트래블 · '솔스테이' 검색", "url": "https://link.coupang.com/a/hK8T0ZEOAu", "thumb": "thumbs/001.jpg", "keywords": "료칸 솔스테이 송정 부산 히노끼탕"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const P = D.profile;
document.title = P.name;
$('disc').textContent = (D.disclosure + '\u00a0'.repeat(12)).repeat(2);
$('name').textContent = P.name;
$('bio').textContent = P.bio;
$('handle').textContent = '@' + P.handle;
$('ig').href = 'https://instagram.com/' + encodeURIComponent(P.handle);
$('chat').href = 'https://ig.me/m/' + encodeURIComponent(P.handle);
$('notice').textContent = D.notice;
const av = $('avatar');
if (P.avatar) { av.src = P.avatar; av.onerror = () => { av.onerror = null; av.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='; }; }

function btn(url, inner) {
  const a = document.createElement('a');
  a.className = 'btn'; a.href = url; a.target = '_blank'; a.rel = 'noopener sponsored';
  inner(a);
  const arr = document.createElement('span'); arr.className = 'arr'; arr.textContent = '›';
  a.appendChild(arr);
  return a;
}
D.featured.forEach(f => $('featured').appendChild(btn(f.url, a => {
  const t = document.createElement('span'); t.className = 't'; t.textContent = f.emoji + ' ' + f.title;
  a.appendChild(t);
})));

const items = D.items.slice().sort((a, b) => b.no - a.no);
const rows = items.map(it => {
  const a = btn(it.url, a => {
    a.classList.add('item');
    let th;
    if (it.thumb) { th = document.createElement('img'); th.src = it.thumb; th.alt = ''; th.loading = 'lazy'; }
    else { th = document.createElement('div'); th.textContent = it.no; }
    th.className = 'thumb'; a.appendChild(th);
    const t = document.createElement('span'); t.className = 't';
    t.textContent = '[' + it.no + '] ' + it.title;
    if (it.platform) { t.appendChild(document.createElement('br')); t.append('(' + it.platform + ')'); }
    a.appendChild(t);
  });
  a.dataset.key = (it.no + ' ' + it.title + ' ' + (it.platform || '') + ' ' + (it.keywords || '')).toLowerCase();
  a.dataset.no = String(it.no);
  $('list').appendChild(a);
  return a;
});
if (!rows.length) { $('empty').textContent = '곧 첫 숙소가 올라와요 ✈️'; $('empty').style.display = 'block'; }
$('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase().replace(/[\[\]]/g, '');
  let n = 0;
  rows.forEach(r => {
    const hit = !q || (/^\d+$/.test(q) ? r.dataset.no === q : r.dataset.key.includes(q));
    r.style.display = hit ? '' : 'none'; if (hit) n++;
  });
  $('empty').style.display = n ? 'none' : 'block';
});

// 댓글 DM용 바로가기: 주소 끝 #번호 (예: /#1) 면 그 번호만 보여 준다
function fromHash() {
  const m = decodeURIComponent(location.hash.slice(1)).match(/^\d+$/);
  if (!m) return;
  $('q').value = m[0];
  $('q').dispatchEvent(new Event('input'));
}
fromHash();
window.addEventListener('hashchange', fromHash);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1500); }
async function copyUrl() { try { await navigator.clipboard.writeText(location.href); toast('링크를 복사했어요'); } catch (e) { toast('복사하지 못했어요'); } }
$('copy').onclick = copyUrl;
$('share').onclick = async () => {
  if (navigator.share) { try { await navigator.share({ title: P.name, url: location.href }); } catch (e) {} }
  else copyUrl();
};
</script>
</body>
</html>
